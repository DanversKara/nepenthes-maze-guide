<!-- Nepenthes lure link.
     Paste this into the HTML of a page on a site you own, just
     before </body>. One link per domain is plenty.

     Crawlers read raw HTML and follow links regardless of CSS,
     so display:none hides it from humans, not from bots.

     DO NOT put this on a site you want ranked in search results:
     hidden outbound links are a classic deceptive-SEO signal and
     the risk lands on THIS site. App subdomains nobody needs in
     Google (login portals, dashboards, file shares) are ideal;
     your public docs/marketing pages are not.

     >>> EDIT: replace bots.example.com with your tarpit host. <<< -->
<a href="https://bots.example.com/maze" rel="nofollow" tabindex="-1" aria-hidden="true" style="display:none">archive</a>
